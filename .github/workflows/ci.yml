name: CPU correctness and hygiene

on:
  push:
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19
      - name: Check C++ and CUDA formatting
        run: bash scripts/check-format.sh

  cpp-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [local-debug, local-release, sanitizer-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ curl software-properties-common
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake 3.30+
        run: |
          python -m pip install 'cmake>=3.30,<5'
          cmake --version
      - name: Install OpenEB SDK Stream
        run: |
          curl -fsSL https://propheseeai.jfrog.io/artifactory/api/security/keypair/prophesee-gpg/public -o /tmp/propheseeai.jfrog.op.asc
          sudo install -m 644 /tmp/propheseeai.jfrog.op.asc /etc/apt/trusted.gpg.d/propheseeai.jfrog.op.asc
          sudo add-apt-repository -y 'https://propheseeai.jfrog.io/artifactory/openeb-debian/'
          sudo apt-get update
          sudo apt-get install -y metavision-openeb
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
