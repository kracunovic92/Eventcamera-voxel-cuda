name: C++ CI

on:
  push:
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19

      - name: Check formatting
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' '*.h' \
            | xargs -0 -r clang-format-19 --dry-run --Werror

  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: cmake --preset local-debug

      - name: Build
        run: cmake --build --preset local-debug --parallel 2

      - name: Run tests
        run: ctest --test-dir build/local-debug --output-on-failure
